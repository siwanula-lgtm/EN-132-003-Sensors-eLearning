services:
  sensors-elearning:
    build: .
    image: en-132-003-sensors-elearning:latest
    container_name: en-132-003-sensors-elearning
    ports:
      - "8033:3000"
    restart: unless-stopped
    volumes:
      - visitor-stats:/app/data   # เก็บสถิติการเข้าใช้ถาวร ไม่หายเมื่อ build ใหม่

volumes:
  visitor-stats:
